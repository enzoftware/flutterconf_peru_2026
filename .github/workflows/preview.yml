name: PR preview

# Builds every PR into gh-pages:/pr-preview/pr-<n>/, so it is served at
# https://enzoftware.github.io/flutterconf_peru_2026/pr-preview/pr-<n>/ and a sticky comment on the
# PR links to it. Closing or merging the PR removes the preview.
#
# Previews build without the PostHog and sign-up keys (no analytics, and the form never writes rows
# to the real sheet) and with PREVIEW_BUILD=true, which marks every page noindex.
# PRs from forks are skipped: their GITHUB_TOKEN cannot push to gh-pages.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - if: github.event.action != 'closed'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: github.event.action != 'closed'
        run: npm ci
      - if: github.event.action != 'closed'
        run: npm run build
        env:
          BASE_PATH: /flutterconf_peru_2026/pr-preview/pr-${{ github.event.number }}
          PREVIEW_BUILD: 'true'

      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: ${{ github.event.action == 'closed' && 'remove' || 'deploy' }}
          wait-for-pages-deployment: 'true'
          qr-code: 'false'
