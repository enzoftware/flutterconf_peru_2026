name: Deploy to GitHub Pages

# Production is the root of the gh-pages branch. PR previews live next to it in
# gh-pages:/pr-preview/pr-<n>/ (see preview.yml), so this deploy never touches that folder.
# Settings → Pages must be "Deploy from a branch: gh-pages / (root)".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Not shared with preview.yml: a shared group would let a preview cancel a pending production
# deploy. Pushes that race with a preview are rebased and retried by the deploy action.
concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Optional keys (see .env.example). Add them as repository secrets; empty = feature off.
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST || 'https://us.i.posthog.com' }}
          PUBLIC_REGISTER_ENDPOINT: ${{ secrets.PUBLIC_REGISTER_ENDPOINT }}
      # Branch deploys run Jekyll, which drops folders that start with "_" (Astro's _astro/).
      - run: touch dist/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
          clean-exclude: pr-preview/
          force: false
